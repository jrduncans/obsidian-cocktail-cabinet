version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      ignore:
          # The API types must match manifest.json's minAppVersion, so tsc catches
          # newer APIs. Bump both together, by hand.
          - dependency-name: obsidian
          # typescript-eslint doesn't support TypeScript 7 yet.
          - dependency-name: typescript
            update-types:
                - version-update:semver-major
          # Match the oldest Node.js version CI tests, not the newest release.
          - dependency-name: '@types/node'
            update-types:
                - version-update:semver-major
      groups:
          # eslint and @eslint/js majors only install together.
          eslint:
              patterns:
                  - eslint
                  - '@eslint/*'
          minor-and-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          minor-and-patch:
              update-types:
                  - minor
                  - patch
